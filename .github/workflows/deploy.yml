# Each push to main runs every check, builds db.json and the app, and deploys them to eldenroll.com (README.md#Releasing).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, in push order
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: |
          python -m venv .venv
          ./.venv/bin/pip install -e "pipeline[dev]"
          cd web && pnpm install --frozen-lockfile

      - name: Build db.json
        working-directory: pipeline
        run: ../.venv/bin/python -m eldenroll.build.database

      - name: Check the pipeline
        working-directory: pipeline
        run: ../.venv/bin/ruff check . && ../.venv/bin/pyright && ../.venv/bin/python -m pytest

      - name: Check the app
        working-directory: web
        run: pnpm typecheck && pnpm test

      - name: Build the app
        working-directory: web
        run: pnpm build

      - name: Deploy
        working-directory: web
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
