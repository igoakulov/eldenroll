# Dev tools live in the repo-level virtualenv. From the repo root:
#   python3 -m venv .venv
#   ./.venv/bin/pip install -e "pipeline[dev]"
# Checks are then run from this directory:
#   ../.venv/bin/ruff check . && ../.venv/bin/pyright && ../.venv/bin/python -m pytest

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eldenrando"]

[project]
name = "eldenrando"
version = "0.1.0"
description = "Offline ETL that builds the EldenRando database from raw game data"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pyright]
include = ["eldenrando", "tests"]
exclude = [".venv"]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
